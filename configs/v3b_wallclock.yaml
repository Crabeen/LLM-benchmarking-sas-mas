# Thesis-extension pilot: wall-clock budget mode.
# Same code path; only the budget block changes. Calibrate `levels` (seconds)
# after the token pilot by looking at observed sec/q in analyze.py output —
# pick deadlines that make roughly 1k / 2k thinking tokens feasible for SAS
# on YOUR hardware, so token-mode and wallclock-mode results are relatable.

seed: 0
temperature: 0.0
output_dir: results/v3b_wallclock

model:
  name: /mnt/parscratch/users/acu25yx/checkpoints/qwen3-4b-sft-merged-v3b
  tensor_parallel_size: 1
  max_model_len: 16384
  enforce_eager: true
  gpu_memory_utilization: 0.90

data:
  split: validation
  n: 200
  context_mode: oracle

systems: [sas, sequential]

budget:
  mode: wallclock
  levels: [10, 20]           # seconds per question — calibrate on your GPU
  init_tokens_per_sec: 40    # rough prior; EMA-updated from observed throughput
  safety_factor: 0.85
  answer_reserve_seconds: 5
