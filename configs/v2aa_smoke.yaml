# Paper-faithful pilot: token budget mode (Tran & Kiela protocol).
# Run this FIRST to validate the pipeline against the paper's direction.

seed: 0
temperature: 0.0
output_dir: results/v2aa_smoke

model:
  # 80GB card: Qwen/Qwen3-30B-A3B  |  40GB card: /mnt/parscratch/users/acu25yx/checkpoints/qwen3-4b-sft-merged-v2a-aligned
  # Llama family (paper's second family): deepseek-ai/DeepSeek-R1-Distill-Llama-8B
  name: /mnt/parscratch/users/acu25yx/checkpoints/qwen3-4b-sft-merged-v2a-aligned
  tensor_parallel_size: 1
  max_model_len: 16384
  gpu_memory_utilization: 0.90

